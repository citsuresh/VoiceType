<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E5E7EB"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square app background -->
  <rect x="8" y="8" width="240" height="240" rx="52" ry="52" fill="url(#bg)"/>

  <!-- Microphone capsule -->
  <rect x="104" y="52" width="48" height="96" rx="24" ry="24" fill="url(#mic)"/>

  <!-- Mic stand arc -->
  <path d="M76 120 a52 52 0 0 0 104 0"
        fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>

  <!-- Stem -->
  <rect x="122" y="172" width="12" height="30" rx="6" fill="#FFFFFF"/>

  <!-- Base -->
  <rect x="92" y="198" width="72" height="12" rx="6" fill="#FFFFFF"/>

  <!-- Sound waves -->
  <path d="M186 92 a34 34 0 0 1 0 56" fill="none" stroke="#C4B5FD" stroke-width="8" stroke-linecap="round"/>
  <path d="M70 92 a34 34 0 0 0 0 56" fill="none" stroke="#C4B5FD" stroke-width="8" stroke-linecap="round"/>
</svg>
