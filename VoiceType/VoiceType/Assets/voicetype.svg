<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Filled monochrome microphone glyph on a transparent background. White fill with a
       dark outline so it reads clearly at small tray sizes on both dark and light
       backgrounds. Drawn in two layers: a dark base (fill + wide stroke) and a white
       top layer, which leaves a consistent dark outline around every shape. -->

  <!-- Dark base layer -->
  <g fill="#1F1F1F" stroke="#1F1F1F" stroke-linecap="round" stroke-linejoin="round">
    <rect x="102" y="30" width="52" height="104" rx="26" ry="26" stroke-width="8"/>
    <rect x="122" y="164" width="12" height="26" rx="6" stroke-width="8"/>
    <rect x="98" y="188" width="60" height="14" rx="7" stroke-width="8"/>
  </g>
  <g fill="none" stroke="#1F1F1F" stroke-linecap="round">
    <path d="M84 122 a44 44 0 0 0 88 0" stroke-width="32"/>
    <path d="M177.7 53.6 a42 42 0 0 1 0 36.8" stroke-width="23"/>
    <path d="M199.4 39 a70 70 0 0 1 0 74" stroke-width="22"/>
    <path d="M78.3 53.6 a42 42 0 0 0 0 36.8" stroke-width="23"/>
    <path d="M56.6 39 a70 70 0 0 0 0 74" stroke-width="22"/>
  </g>

  <!-- White top layer -->
  <g fill="#FFFFFF">
    <rect x="102" y="30" width="52" height="104" rx="26" ry="26"/>
    <rect x="122" y="164" width="12" height="26" rx="6"/>
    <rect x="98" y="188" width="60" height="14" rx="7"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M84 122 a44 44 0 0 0 88 0" stroke-width="24"/>
    <path d="M177.7 53.6 a42 42 0 0 1 0 36.8" stroke-width="15"/>
    <path d="M199.4 39 a70 70 0 0 1 0 74" stroke-width="14"/>
    <path d="M78.3 53.6 a42 42 0 0 0 0 36.8" stroke-width="15"/>
    <path d="M56.6 39 a70 70 0 0 0 0 74" stroke-width="14"/>
  </g>
</svg>
